services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: gabriel
      POSTGRES_PASSWORD: Gc-71602003
      POSTGRES_DB: delivery_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gabriel -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  web:
    build: .
    container_name: delivery-web
    restart: unless-stopped
    environment:
      - POSTGRES_PRISMA_URL=postgresql://gabriel:Gc-71602003@postgres:5432/delivery_db?schema=public
      - DATABASE_URL=postgresql://gabriel:Gc-71602003@postgres:5432/delivery_db?schema=public
      - NODE_ENV=production
      - NEXTAUTH_URL=https://localhost
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pnpm prisma generate --schema=./prisma/schema.prisma &&
             pnpm prisma migrate deploy --schema=./prisma/schema.prisma &&
             pnpm start"
    networks:
      - delivery-network

  https-proxy:
    image: nginx:stable-alpine
    container_name: delivery-https-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/private.key:/etc/nginx/certs/private.key:ro
    depends_on:
      - web
    networks:
      - delivery-network

volumes:
  postgres_data:
    driver: local

networks:
  delivery-network:
    driver: bridge
